<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Stirio — Open Graph share card</title>
  <defs>
    <radialGradient id="ogAmber" cx="85%" cy="10%" r="75%">
      <stop offset="0%"   stop-color="#c9971c" stop-opacity="0.34"/>
      <stop offset="45%"  stop-color="#c9971c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d0508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogCyan" cx="8%" cy="95%" r="65%">
      <stop offset="0%"   stop-color="#59a9c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0508" stop-opacity="0"/>
    </radialGradient>
    <filter id="ogDotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0508"/>
  <rect width="1200" height="630" fill="url(#ogAmber)"/>
  <rect width="1200" height="630" fill="url(#ogCyan)"/>

  <!-- Wordmark: Stirio. -->
  <g transform="translate(80 0)">
    <!-- Dot halo -->
    <circle cx="666" cy="310" r="38" fill="#c9971c" opacity="0.40" filter="url(#ogDotGlow)"/>
    <text x="0" y="340"
          font-family="'Fraunces','Instrument Serif','DejaVu Serif','Liberation Serif','Times New Roman',serif"
          font-weight="700"
          font-size="260"
          letter-spacing="-8"
          fill="#f6f3ea">Stirio<tspan fill="#c9971c">.</tspan></text>
    <!-- Tagline -->
    <text x="6" y="420"
          font-family="'DejaVu Sans Mono','Liberation Mono','Courier New',monospace"
          font-weight="400"
          font-size="28"
          letter-spacing="6"
          fill="#c9971c"
          opacity="0.85">APRENDE COCTELERÍA · 60 SEGUNDOS</text>
    <text x="6" y="475"
          font-family="'Fraunces','Instrument Serif','DejaVu Serif','Liberation Serif',serif"
          font-weight="400"
          font-size="34"
          fill="#cfc9bd"
          opacity="0.88">Quizzes, duelos, flashcards y una enciclopedia 3D.</text>
  </g>

  <!-- Decorative martini silhouette bottom-right -->
  <g transform="translate(920 120)" opacity="0.28" fill="none" stroke="#c9971c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 40 L 220 40 L 120 190 Z" fill="#c9971c" fill-opacity="0.10"/>
    <line x1="120" y1="190" x2="120" y2="290"/>
    <line x1="60"  y1="298" x2="180" y2="298" stroke-width="14"/>
    <!-- Olive pick + olive -->
    <line x1="180" y1="40" x2="160" y2="82" stroke-width="5"/>
    <circle cx="156" cy="92" r="13" fill="#c9971c" stroke="none"/>
  </g>
</svg>
