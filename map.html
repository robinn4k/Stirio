<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stirio — Mapa de bebidas</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg-0, #0d0508); color: var(--ink-1, #eee); font-family: var(--f-sans, system-ui); overflow: hidden; }
    .spirit-map-root { height: 100%; display: flex; flex-direction: column; }
    .spirit-map-filter {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 10px 12px;
      background: var(--bg-1, #12080a); border-bottom: 1px solid var(--line, #2a1c1e);
      flex-shrink: 0;
    }
    .spirit-map-filter-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 99px;
      background: var(--bg-2, #1a0e11); color: var(--ink-2, #bbb);
      border: 1px solid var(--line, #2a1c1e);
      font-size: 12px; white-space: nowrap; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
      font-family: inherit;
      opacity: 0.55;
    }
    .spirit-map-filter-btn:hover { background: var(--bg-3, #221417); opacity: 0.85; }
    .spirit-map-filter-btn.active {
      background: color-mix(in oklch, var(--amber, #d4a24c) 22%, var(--bg-2));
      color: var(--ink-1, #eee);
      border-color: color-mix(in oklch, var(--amber, #d4a24c) 55%, transparent);
      opacity: 1;
    }
    .spirit-map-filter-dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block; box-shadow: 0 0 6px currentColor;
    }
    .spirit-map-filter-badge {
      font-family: var(--f-mono, monospace);
      font-size: 10px;
      padding: 1px 6px; border-radius: 99px;
      background: color-mix(in oklch, var(--ink-3, #888) 18%, transparent);
      color: var(--ink-2, #bbb);
      min-width: 20px; text-align: center;
    }
    .spirit-map-filter-btn.active .spirit-map-filter-badge {
      background: color-mix(in oklch, var(--amber, #d4a24c) 28%, transparent);
      color: var(--amber, #d4a24c);
    }
    /* Collapsible toggle (visible only on mobile) */
    .spirit-map-filter-toggle {
      display: none;
      align-items: center; gap: 8px;
      margin: 10px 12px 0;
      padding: 8px 14px;
      background: var(--bg-1, #12080a);
      color: var(--ink-1, #eee);
      border: 1px solid var(--line, #2a1c1e);
      border-radius: 99px;
      font-size: 13px; font-family: inherit; cursor: pointer;
      align-self: flex-start;
    }
    .spirit-map-filter-toggle-caret {
      transition: transform 0.2s;
      font-size: 10px; color: var(--ink-3, #888);
    }
    .spirit-map-filter-toggle.open .spirit-map-filter-toggle-caret {
      transform: rotate(180deg);
    }
    .spirit-map-filter-count {
      font-family: var(--f-mono, monospace);
      color: var(--amber, #d4a24c);
      font-size: 11px;
    }
    @media (max-width: 600px) {
      .spirit-map-filter-toggle { display: inline-flex; }
      .spirit-map-filter {
        display: none;
        padding: 8px 12px 10px;
        border-top: 1px solid var(--line, #2a1c1e);
      }
      .spirit-map-filter.open { display: flex; }
      .spirit-map-filter-btn {
        flex: 1 1 calc(50% - 3px);
        justify-content: flex-start;
        min-width: 0;
      }
      .spirit-map-filter-label {
        flex: 1; overflow: hidden; text-overflow: ellipsis;
      }
    }
    .spirit-map-body { flex: 1; position: relative; }
    .spirit-map-body .leaflet-container { width: 100%; height: 100%; background: var(--bg-0, #0d0508); }
    .spirit-marker-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 14px; border: 1px solid rgba(255,255,255,0.4);
    }
    .spirit-popup {
      min-width: 180px; text-align: center;
      font-family: var(--f-sans, system-ui);
    }
    .spirit-popup-icon { font-size: 32px; margin-bottom: 4px; }
    .spirit-popup-title { font-family: var(--f-serif, serif); font-size: 16px; font-weight: 700; color: #1a1a1a; }
    .spirit-popup-spirit { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0 6px; }
    .spirit-popup-origin, .spirit-popup-date {
      font-size: 12px; color: #444; margin-bottom: 2px;
    }
    .spirit-popup-desc { font-size: 12px; color: #333; margin-top: 6px; line-height: 1.4; }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: var(--ink-2, #bbb);
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--line, #333);
      border-top-color: var(--amber, #d4a24c); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="map-root" class="spirit-map-root">
    <div class="loading">
      <div class="spinner"></div>
      <div id="map-loading-label">Cargando mapa…</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module">
    import { initSpiritMap } from './js/wiki-map.js';
    import { t, preloadAllTranslations } from './js/lang.js';
    try { await preloadAllTranslations(); } catch {}
    // Translate the loading label if a key is available; otherwise keep ES.
    const loadingEl = document.getElementById('map-loading-label');
    if (loadingEl) {
      const v = t('wiki.map.loading');
      if (v && v !== 'wiki.map.loading') loadingEl.textContent = v;
    }
    const root = document.getElementById('map-root');
    // Wait for Leaflet
    const start = () => {
      if (typeof L === 'undefined') { setTimeout(start, 50); return; }
      initSpiritMap(root);
    };
    start();
  </script>
</body>
</html>
