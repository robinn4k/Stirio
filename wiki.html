<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stirio Wiki 3D</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    #wiki-root { height: 100vh; display: flex; flex-direction: column; }
    .wiki-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .wiki-back {
      background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 4px;
      line-height: 1;
    }
    .wiki-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .wiki-search {
      flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px; color: var(--text); font-size: 0.875rem;
    }
    .wiki-search:focus { outline: none; border-color: var(--accent); }
    .wiki-layout { display: flex; flex: 1; overflow: hidden; }
    .wiki-sidebar {
      width: 280px; overflow-y: auto; border-right: 1px solid var(--border);
      padding: 8px 0; flex-shrink: 0;
    }
    @media (max-width: 600px) { .wiki-sidebar { display: none; } }
    .wiki-category { padding: 6px 16px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 8px; }
    .wiki-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; cursor: pointer; font-size: 0.875rem; color: var(--text-2);
      border-left: 2px solid transparent; transition: all 0.15s;
    }
    .wiki-item:hover { background: var(--surface-2); color: var(--text); }
    .wiki-item.active { border-left-color: var(--accent); color: var(--accent); background: color-mix(in oklch, var(--accent) 10%, transparent); }
    .wiki-item-icon { font-size: 1.1rem; flex-shrink: 0; }
    .wiki-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wiki-canvas-wrap { flex: 1; position: relative; }
    #r3f-canvas { width: 100%; height: 100%; display: block; }
    .wiki-fallback {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; text-align: center; padding: 24px;
    }
    .wiki-fallback-icon { font-size: 4rem; }
    .wiki-fallback-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .wiki-fallback-desc { color: var(--text-muted); font-size: 0.875rem; max-width: 300px; line-height: 1.5; }
    .wiki-info-panel {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 16px; max-height: 220px; overflow-y: auto; flex-shrink: 0;
    }
    .wiki-info-name { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .wiki-info-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .wiki-info-chip {
      background: color-mix(in oklch, var(--accent) 15%, var(--surface-2));
      color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem;
    }
    .wiki-info-desc { font-size: 0.875rem; color: var(--text-2); line-height: 1.6; }
    .wiki-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg); flex-direction: column; gap: 12px;
    }
    .wiki-spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="wiki-root">
  <div class="wiki-header">
    <button class="wiki-back" onclick="window.parent.postMessage({type:'wiki-close'},'*')" title="Volver">←</button>
    <span class="wiki-title">Encyclopedia 3D</span>
    <input class="wiki-search" type="search" placeholder="Buscar cóctel, ingrediente…" id="wiki-search-input">
  </div>
  <div class="wiki-layout">
    <nav class="wiki-sidebar" id="wiki-sidebar"></nav>
    <main class="wiki-main">
      <div class="wiki-canvas-wrap">
        <div class="wiki-loading" id="wiki-loading">
          <div class="wiki-spinner"></div>
          <span style="color:var(--text-muted);font-size:.875rem">Cargando Three.js…</span>
        </div>
        <canvas id="r3f-canvas"></canvas>
      </div>
      <div class="wiki-info-panel" id="wiki-info-panel" style="display:none"></div>
    </main>
  </div>
</div>

<!-- Three.js ES modules via importmap (required by wiki-3d.js / wiki-scenes.js) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script>
// Sync theme from parent
(function() {
  const p = window.parent;
  if (p && p !== window) {
    try {
      const htmlEl = p.document.documentElement;
      ['theme','density','device','featured'].forEach(attr => {
        const v = htmlEl.getAttribute('data-' + attr);
        if (v) document.documentElement.setAttribute('data-' + attr, v);
      });
    } catch(e) {}
  }
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'wiki-theme') {
      Object.entries(e.data.attrs || {}).forEach(([k,v]) => document.documentElement.setAttribute(k, v));
    }
  });
})();

// Wiki data from existing wiki-data.js (loaded inline below or via fetch)
const WIKI_CATEGORIES = [
  { id: 'highball',  labelKey: 'wiki.cat_highball',  labelFallback: 'Highball',      icon: '🥃', items: ['Mojito', 'Gin & Tonic', 'Moscow Mule', 'Dark \'n\' Stormy'] },
  { id: 'sours',     labelKey: 'wiki.cat_sours',     labelFallback: 'Sours',         icon: '🍋', items: ['Whiskey Sour', 'Pisco Sour', 'Amaretto Sour', 'Daiquiri'] },
  { id: 'martini',   labelKey: 'wiki.cat_martini',   labelFallback: 'Martini & Up',  icon: '🍸', items: ['Dry Martini', 'Cosmopolitan', 'Manhattan', 'Negroni'] },
  { id: 'oldschool', labelKey: 'wiki.cat_oldschool', labelFallback: 'Old-School',    icon: '🥃', items: ['Old Fashioned', 'Sazerac', 'Vieux Carré', 'Toronto'] },
  { id: 'tiki',      labelKey: 'wiki.cat_tiki',      labelFallback: 'Tiki',          icon: '🌺', items: ['Mai Tai', 'Zombie', 'Jungle Bird', 'Painkiller'] },
  { id: 'spirits',   labelKey: 'wiki.cat_spirits',   labelFallback: 'Espirituosos',  icon: '🫙', items: ['Ron Zacapa 23', 'Mezcal Banhez', 'Vodka Grey Goose', 'Gin Hendrick\'s'] },
];

// i18n bridge: usa window.wikiT inyectado por el module script más abajo
const wt = (key, fallback) => (window.wikiT ? window.wikiT(key, fallback) : fallback);
// Construido dinámicamente para que al cambiar idioma se traduzca todo
function cocktailInfoFor(name) {
  const defaults = { chips: [wt('wiki.default_chip', 'Cóctel')], desc: wt('wiki.default_desc', 'Explora este cóctel en 3D.') };
  const perCocktail = {
    'Negroni':       { chips: ['IBA', 'Stirred', 'Gin'],    desc: wt('wiki.negroni_desc', 'El Negroni es un cóctel clásico italiano.') },
    'Dry Martini':   { chips: ['IBA', 'Stirred', 'Gin'],    desc: wt('wiki.martini_desc', 'El Dry Martini es la cumbre de la elegancia.') },
    'Mojito':        { chips: ['IBA', 'Built', 'Ron'],      desc: wt('wiki.mojito_desc', 'El Mojito es un highball cubano.') },
    'Old Fashioned': { chips: ['Classic', 'Stirred', 'Whiskey'], desc: wt('wiki.oldfashioned_desc', 'El Old Fashioned es el primer cóctel documentado.') },
    'Daiquiri':      { chips: ['IBA', 'Shaken', 'Ron'],     desc: wt('wiki.daiquiri_desc', 'El Daiquiri es pureza.') },
  };
  return perCocktail[name] || defaults;
}

let selectedItem = null;

// ── Per-cocktail scene parameters (glass shape + layer colors) ──
// Keys match the items in WIKI_CATEGORIES above.
const COCKTAIL_SCENES = {
  'Mojito':         { builder: 'cocktail-glass', glass: 'highball', colors: ['#c8e6b4'], layers: [0.85] },
  'Gin & Tonic':    { builder: 'cocktail-glass', glass: 'highball', colors: ['#d6efff'], layers: [0.85] },
  'Moscow Mule':    { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#f4b860'], layers: [0.7] },
  "Dark 'n' Stormy":{ builder: 'cocktail-glass', glass: 'highball', colors: ['#4a2d1a', '#d18b4a'], layers: [0.35, 0.5] },
  'Whiskey Sour':   { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#e6b25a'], layers: [0.75] },
  'Pisco Sour':     { builder: 'cocktail-glass', glass: 'coupe',    colors: ['#f2d89f'], layers: [0.85] },
  'Amaretto Sour':  { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#c27a3a'], layers: [0.75] },
  'Daiquiri':       { builder: 'cocktail-glass', glass: 'coupe',    colors: ['#eaf7ea'], layers: [0.8] },
  'Dry Martini':    { builder: 'cocktail-glass', glass: 'martini',  colors: ['#f5f3d2'], layers: [0.85] },
  'Cosmopolitan':   { builder: 'cocktail-glass', glass: 'martini',  colors: ['#d6376a'], layers: [0.85] },
  'Manhattan':      { builder: 'cocktail-glass', glass: 'coupe',    colors: ['#7e1b1b'], layers: [0.85] },
  'Negroni':        { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#b11f27'], layers: [0.75] },
  'Old Fashioned':  { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#b07326'], layers: [0.7] },
  'Sazerac':        { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#a0471c'], layers: [0.72] },
  'Vieux Carré':    { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#8a3112'], layers: [0.72] },
  'Toronto':        { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#5a240c'], layers: [0.72] },
  'Mai Tai':        { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#cc5c2a'], layers: [0.75] },
  'Zombie':         { builder: 'cocktail-glass', glass: 'hurricane',colors: ['#e04325', '#f3a130'], layers: [0.45, 0.45] },
  'Jungle Bird':    { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#a53a1a'], layers: [0.75] },
  'Painkiller':     { builder: 'cocktail-glass', glass: 'hurricane',colors: ['#d9aa68'], layers: [0.85] },
  'Ron Zacapa 23':  { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#5b2510'], layers: [0.8] },
  'Mezcal Banhez':  { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#e8e4c7'], layers: [0.8] },
  'Vodka Grey Goose':{builder: 'cocktail-glass', glass: 'rocks',    colors: ['#e6efff'], layers: [0.8] },
  "Gin Hendrick's": { builder: 'cocktail-glass', glass: 'rocks',    colors: ['#dcdfe0'], layers: [0.8] },
};
const DEFAULT_SCENE = { builder: 'cocktail-glass', glass: 'rocks', colors: ['#b11f27'], layers: [0.75] };

function buildSidebar(filter) {
  const sidebar = document.getElementById('wiki-sidebar');
  sidebar.innerHTML = '';
  WIKI_CATEGORIES.forEach(cat => {
    const items = filter ? cat.items.filter(i => i.toLowerCase().includes(filter.toLowerCase())) : cat.items;
    if (!items.length) return;
    const catEl = document.createElement('div');
    catEl.className = 'wiki-category';
    catEl.textContent = cat.icon + '  ' + wt(cat.labelKey, cat.labelFallback);
    sidebar.appendChild(catEl);
    items.forEach(name => {
      const el = document.createElement('div');
      el.className = 'wiki-item' + (selectedItem === name ? ' active' : '');
      el.innerHTML = `<span class="wiki-item-icon">${cat.icon}</span><span>${name}</span>`;
      el.onclick = () => selectItem(name);
      sidebar.appendChild(el);
    });
  });
}

function selectItem(name) {
  selectedItem = name;
  buildSidebar(document.getElementById('wiki-search-input').value);
  showInfo(name);
  if (window.wikiLoadScene) window.wikiLoadScene(name);
}

function showInfo(name) {
  const panel = document.getElementById('wiki-info-panel');
  const info = cocktailInfoFor(name);
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="wiki-info-name">${name}</div>
    <div class="wiki-info-chips">${info.chips.map(c => `<span class="wiki-info-chip">${c}</span>`).join('')}</div>
    <div class="wiki-info-desc">${info.desc}</div>
  `;
}


// Sidebar-only init runs immediately; the 3D engine starts from a separate
// ES-module block below (which imports wiki-3d.js + wiki-scenes.js).
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar('');
  document.getElementById('wiki-search-input').addEventListener('input', e => buildSidebar(e.target.value));
});
</script>

<script type="module">
// ── i18n bridge: carga lang.js (mismo origen, lee el lang del localStorage) ──
// Expone window.wikiT para que los textos de COCKTAIL_INFO se traduzcan.
// El lang actual se determina automáticamente desde localStorage 'stirio_lang',
// que es compartido con el parent (index.html) al ser mismo origen.
import { t as _t, preloadAllTranslations } from './js/lang.js';
try { await preloadAllTranslations(); } catch {}
window.wikiT = (key, fallback) => {
  const v = _t(key);
  return (v && v !== key) ? v : (fallback || key);
};

// ── Modern ES-module 3D engine ───────────────────────────────────────
// Uses the real wiki-3d.js + wiki-scenes.js stack (SCENE_BUILDERS for every
// cocktail, tool, technique, alambique) via importmap-resolved three.
import { mountScene, dispose } from './js/wiki-3d.js';
import { SCENE_BUILDERS, buildCocktailScene } from './js/wiki-scenes.js';

const canvas = document.getElementById('r3f-canvas');
const wrap = canvas.parentElement;
const loading = document.getElementById('wiki-loading');

function buildFnFor(name) {
  const cfg = window.COCKTAIL_SCENES[name] || window.DEFAULT_SCENE;
  const builder = (cfg.builder && SCENE_BUILDERS[cfg.builder]) || buildCocktailScene;
  return (scene, camera, ctx) => {
    try {
      if (cfg.builder === 'cocktail-glass' || !cfg.builder) {
        buildCocktailScene(scene, camera, ctx, { glass: cfg.glass, colors: cfg.colors, layers: cfg.layers });
      } else {
        builder(scene, camera, ctx);
      }
    } catch (err) {
      console.warn('scene build failed for', name, err);
    }
  };
}

window.wikiLoadScene = (name) => {
  try {
    // Hide the legacy loader/canvas CSS placeholder and mount a real scene
    loading.style.display = 'none';
    canvas.style.display = 'none'; // wiki-3d.js creates its own renderer inside wrap
    mountScene(wrap, buildFnFor(name));
  } catch (err) {
    console.warn('wikiLoadScene failed:', err);
    loading.style.display = 'block';
    loading.innerHTML = `
      <div class="wiki-fallback">
        <div class="wiki-fallback-icon">🍸</div>
        <div class="wiki-fallback-title">Vista 3D no disponible</div>
        <div class="wiki-fallback-desc">No se pudo cargar Three.js. Comprueba tu conexión a internet.</div>
      </div>`;
  }
};

// Boot: select initial item once DOM is ready
const _boot = () => (typeof window.selectItem === 'function' ? window.selectItem('Negroni') : window.wikiLoadScene('Negroni'));
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _boot);
} else {
  _boot();
}
</script>
</body>
</html>
