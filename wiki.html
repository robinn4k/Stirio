<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stirio · Enciclopedia</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    /* Wiki page styled to match the main Stirio card aesthetic
       (css/style.css .card, chip, btn — all via tokens.css). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg-0);
      color: var(--ink-0);
      font-family: var(--f-ui);
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(ellipse 600px 400px at 85% -10%, var(--amber-soft), transparent 60%),
        radial-gradient(ellipse 500px 400px at -10% 100%, var(--cyan-soft), transparent 60%),
        var(--bg-0);
      background-attachment: fixed;
    }
    #wiki-root {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ─── Header ─── */
    .wiki-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: var(--bg-1);
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
      z-index: 2;
    }
    .wiki-back {
      display: grid; place-items: center;
      width: 36px; height: 36px;
      border-radius: var(--r-pill);
      background: var(--bg-2);
      border: 1px solid var(--line-soft);
      color: var(--ink-0);
      font-size: 16px; line-height: 1;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .wiki-back:hover { background: var(--bg-3); border-color: var(--line); }
    .wiki-back:active { transform: scale(0.94); }
    .wiki-title {
      font-family: var(--f-serif);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink-0);
      line-height: 1.15;
      flex-shrink: 0;
    }
    .wiki-search {
      flex: 1;
      min-width: 0;
      background: var(--bg-2);
      border: 1px solid var(--line-soft);
      border-radius: var(--r-pill);
      padding: 9px 14px;
      color: var(--ink-0);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .wiki-search::placeholder { color: var(--ink-3); }
    .wiki-search:focus { border-color: var(--amber); background: var(--bg-3); }

    /* ─── Body (scrollable) ─── */
    .wiki-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px 60px;
    }
    .wiki-body[data-view="article"] { padding: 0 0 60px; }

    /* ─── Hub: intro + category grid ─── */
    .wiki-hub-intro {
      max-width: 760px;
      margin: 0 auto 22px;
      padding: 0 2px;
    }
    .wiki-hub-intro .eyebrow {
      display: block;
      font-family: var(--f-mono);
      font-size: 0.68rem;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }
    .wiki-hub-intro .title {
      display: block;
      font-family: var(--f-serif);
      font-size: 1.55rem;
      font-weight: 500;
      color: var(--ink-0);
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .wiki-hub-intro .sub {
      color: var(--ink-3);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .wiki-cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    .wiki-cat-card {
      position: relative;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--line-soft);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      padding: 18px 18px 16px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: var(--ink-0);
      transition: transform .15s, border-color .2s, box-shadow .2s;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    .wiki-cat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--cat-accent, var(--amber));
      opacity: .9;
    }
    .wiki-cat-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in oklch, var(--cat-accent, var(--amber)) 45%, var(--line));
      box-shadow: var(--shadow-md);
    }
    .wiki-cat-icon {
      font-size: 1.75rem;
      line-height: 1;
    }
    .wiki-cat-name {
      font-family: var(--f-serif);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--ink-0);
      line-height: 1.2;
    }
    .wiki-cat-count {
      font-family: var(--f-mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: auto;
    }

    /* ─── Category: article list ─── */
    .wiki-cat-header {
      max-width: 720px;
      margin: 0 auto 20px;
      padding: 0 2px;
    }
    .wiki-cat-header .eyebrow {
      display: block;
      font-family: var(--f-mono);
      font-size: 0.66rem;
      color: var(--cat-accent, var(--amber));
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }
    .wiki-cat-header .name {
      font-family: var(--f-serif);
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--ink-0);
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .wiki-cat-header .desc {
      color: var(--ink-3);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .wiki-art-list {
      display: grid;
      gap: 8px;
      max-width: 720px;
      margin: 0 auto;
    }
    .wiki-art-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--line-soft);
      border-radius: var(--r-md);
      cursor: pointer;
      font-family: inherit;
      color: var(--ink-0);
      text-align: left;
      width: 100%;
      transition: border-color .15s, background .15s, transform .1s;
    }
    .wiki-art-item:hover {
      border-color: var(--amber);
      transform: translateX(2px);
    }
    .wiki-art-item .icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1; }
    .wiki-art-item .name { flex: 1; font-size: 0.95rem; font-weight: 500; color: var(--ink-0); line-height: 1.3; }
    .wiki-art-item .name .sub {
      display: block;
      font-family: var(--f-mono);
      font-size: 0.66rem;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 3px;
    }
    .wiki-art-item .tag-3d {
      display: inline-flex; align-items: center;
      font-family: var(--f-mono);
      font-size: 0.62rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: var(--r-pill);
      background: var(--amber-soft);
      color: var(--amber);
      border: 1px solid oklch(0.82 0.17 75 / 0.3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .wiki-art-item .arrow {
      color: var(--ink-4);
      font-family: var(--f-mono);
      font-size: 0.9rem;
    }

    /* ─── Article detail ─── */
    .wiki-article-hero {
      padding: 28px 22px 18px;
      max-width: 760px;
      margin: 0 auto;
    }
    .wiki-article-hero .icon { font-size: 2.6rem; line-height: 1; }
    .wiki-article-hero .category {
      display: inline-block;
      font-family: var(--f-mono);
      font-size: 0.66rem;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 10px 0 4px;
    }
    .wiki-article-hero .title {
      font-family: var(--f-serif);
      font-size: 1.9rem;
      font-weight: 500;
      color: var(--ink-0);
      line-height: 1.1;
    }
    .wiki-article-3d {
      max-width: 760px;
      margin: 0 auto 18px;
      aspect-ratio: 16/10;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--line-soft);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      position: relative;
    }
    /* Hotspot dots projected from 3D positions onto the 2D overlay layer */
    .hotspot-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--amber);
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.35), 0 0 12px var(--amber-glow, rgba(255,180,60,0.6));
      cursor: pointer;
      padding: 0;
      transition: transform .12s ease, box-shadow .15s;
      animation: hotspotPulse 2.2s ease-in-out infinite;
    }
    .hotspot-dot:hover,
    .hotspot-dot:focus-visible {
      transform: translate(-50%, -50%) scale(1.25);
      outline: none;
    }
    @keyframes hotspotPulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(0,0,0,0.35), 0 0 10px rgba(255,180,60,0.55); }
      50%      { box-shadow: 0 0 0 2px rgba(0,0,0,0.35), 0 0 18px rgba(255,180,60,0.95); }
    }
    /* Hotspot detail panel (opens when a dot is clicked) */
    .hotspot-panel {
      position: absolute;
      left: 12px; right: 12px; bottom: 12px;
      background: var(--bg-1);
      border: 1px solid var(--amber);
      border-radius: var(--r-md);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      padding: 12px 14px;
      color: var(--ink-0);
      font-size: 13px;
      line-height: 1.4;
      z-index: 3;
      pointer-events: auto;
      animation: rise .22s cubic-bezier(.2,.9,.3,1) both;
    }
    .hotspot-panel .hotspot-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 4px;
    }
    .hotspot-panel .hotspot-panel-title {
      font-family: var(--f-serif);
      font-size: 15px;
      color: var(--amber);
    }
    .hotspot-panel .hotspot-panel-close {
      background: transparent; border: none; color: var(--ink-2);
      font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px;
    }
    .hotspot-panel .hotspot-panel-close:hover { color: var(--ink-0); }
    .hotspot-panel .hotspot-panel-body { color: var(--ink-1); }
    .wiki-article-content {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 22px 40px;
    }
    .wiki-section {
      margin-bottom: 14px;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      border: 1px solid var(--line-soft);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
    }
    .wiki-section h3 {
      font-family: var(--f-serif);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink-0);
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .wiki-section p {
      color: var(--ink-2);
      font-size: 0.93rem;
      line-height: 1.6;
    }
    .wiki-section.tip {
      background: linear-gradient(180deg, var(--amber-soft), var(--bg-2));
      border-color: oklch(0.82 0.17 75 / 0.35);
    }
    .wiki-section.errors {
      background: linear-gradient(180deg, oklch(0.68 0.19 25 / 0.12), var(--bg-2));
      border-color: oklch(0.68 0.19 25 / 0.3);
    }
    .wiki-steps {
      display: grid;
      gap: 10px;
    }
    .wiki-step {
      display: flex; align-items: flex-start; gap: 12px;
    }
    .wiki-step-num {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--amber);
      color: oklch(0.2 0.04 60);
      display: grid; place-items: center;
      font-family: var(--f-mono);
      font-size: 0.78rem;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .wiki-step p {
      flex: 1;
      color: var(--ink-2);
      font-size: 0.92rem;
      line-height: 1.55;
      padding-top: 2px;
    }

    /* ─── Search results ─── */
    .wiki-search-results {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      gap: 8px;
    }
    .wiki-empty {
      text-align: center;
      color: var(--ink-3);
      font-size: 0.9rem;
      padding: 40px 20px;
      font-family: var(--f-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ─── Loading ─── */
    .wiki-loading {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      height: 100%;
      color: var(--ink-3);
      font-family: var(--f-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .wiki-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--bg-3);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: wiki-spin 0.7s linear infinite;
    }
    @keyframes wiki-spin { to { transform: rotate(360deg); } }

    /* Scrollbars */
    .wiki-body::-webkit-scrollbar { width: 4px; }
    .wiki-body::-webkit-scrollbar-track { background: transparent; }
    .wiki-body::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 99px; }

    @media (max-width: 640px) {
      .wiki-header { padding: 10px 12px; gap: 8px; }
      .wiki-title { display: none; } /* Save space on narrow devices — search bar is clearly an Enciclopedia action from context */
      .wiki-body { padding: 18px 14px 60px; }
      .wiki-hub-intro { margin-bottom: 18px; }
      .wiki-hub-intro .title { font-size: 1.35rem; }
      .wiki-cat-grid { grid-template-columns: 1fr; gap: 10px; }
      .wiki-cat-card { min-height: 104px; padding: 16px; }
      .wiki-article-hero { padding: 22px 18px 14px; }
      .wiki-article-hero .title { font-size: 1.55rem; }
      .wiki-article-content { padding: 0 14px 40px; }
      .wiki-section { padding: 16px 18px; }
    }
  </style>
</head>
<body>
<div id="wiki-root">
  <div class="wiki-header">
    <button class="wiki-back" id="btn-back" title="Volver" aria-label="Volver">←</button>
    <span class="wiki-title" id="view-title">Enciclopedia</span>
    <input
      class="wiki-search"
      type="search"
      id="search-input"
      placeholder="Buscar artículo, técnica, destilado…"
      autocomplete="off"
    />
  </div>
  <div class="wiki-body" id="body" data-view="hub">
    <div class="wiki-loading">
      <div class="wiki-spinner"></div>
      <span id="loading-label">Cargando enciclopedia…</span>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { WIKI_CATEGORIES, WIKI_ARTICLES, TIMELINE_DATA, GLOSSARY_DATA } from './js/wiki-data.js';
import { t, preloadAllTranslations } from './js/lang.js';

// 3D engine is optional — only articles with has3d use it. If imports fail
// (CDN hiccup / offline) we still render text content.
let mountScene = null, dispose3d = null, SCENE_BUILDERS = {};
try {
  const [three, scenes] = await Promise.all([
    import('./js/wiki-3d.js'),
    import('./js/wiki-scenes.js'),
  ]);
  mountScene = three.mountScene;
  dispose3d = three.dispose;
  SCENE_BUILDERS = scenes.SCENE_BUILDERS || {};
} catch (e) {
  console.warn('[wiki] 3D engine unavailable — text-only mode', e);
}

try { await preloadAllTranslations(); } catch {}

// Sync parent theme
(() => {
  const p = window.parent;
  if (p && p !== window) {
    try {
      const htmlEl = p.document.documentElement;
      ['theme','density','device','featured'].forEach(attr => {
        const v = htmlEl.getAttribute('data-' + attr);
        if (v) document.documentElement.setAttribute('data-' + attr, v);
      });
    } catch {}
  }
})();

const tOr = (key, fb) => {
  const v = t(key);
  return (v && v !== key) ? v : fb;
};

const $body = document.getElementById('body');
const $title = document.getElementById('view-title');
const $back = document.getElementById('btn-back');
const $search = document.getElementById('search-input');
const $loadingLabel = document.getElementById('loading-label');
if ($loadingLabel) $loadingLabel.textContent = tOr('wiki.loading', 'Cargando enciclopedia…');

const state = {
  view: 'hub',       // 'hub' | 'cat' | 'art' | 'search'
  catId: null,
  artId: null,
  stack: [],
};

$back.addEventListener('click', goBack);
$search.addEventListener('input', onSearchInput);

function setView(v) { state.view = v; $body.setAttribute('data-view', v); }

function disposeScene() {
  if (typeof dispose3d === 'function') {
    try { dispose3d(); } catch {}
  }
}

function goBack() {
  if (state.view === 'hub') {
    // At the root — close back to parent SPA
    try { window.parent.postMessage({ type: 'wiki-close' }, '*'); } catch {}
    return;
  }
  if (state.view === 'search') {
    $search.value = '';
    renderHub();
    return;
  }
  const prev = state.stack.pop() || { view: 'hub' };
  if (prev.view === 'hub') renderHub();
  else if (prev.view === 'cat') openCategory(prev.catId, { push: false });
  else renderHub();
}

function push(current) { state.stack.push(current); }

// ─── Hub ──────────────────────────────────────────────────────────
// Extract first color token from a `linear-gradient(..., #abc, #def)` string
// so we can use it as a single accent stripe instead of a loud full-bleed fill.
function extractAccent(gradient) {
  const m = String(gradient || '').match(/#[0-9a-fA-F]{3,8}|rgba?\([^)]+\)|oklch\([^)]+\)|hsl[a]?\([^)]+\)/);
  return m ? m[0] : 'var(--amber)';
}

function renderHub() {
  disposeScene();
  setView('hub');
  state.catId = state.artId = null;
  $title.textContent = tOr('wiki.title', 'Enciclopedia');
  const categories = WIKI_CATEGORIES.map(cat => {
    const name = tOr('wiki.cat.' + cat.id, cat.id);
    const count = cat.articles.length;
    const label = `${count} ${count === 1 ? tOr('wiki.article', 'artículo') : tOr('wiki.articles', 'artículos')}`;
    const accent = extractAccent(cat.gradient);
    return `
      <button class="wiki-cat-card" data-cat="${cat.id}" style="--cat-accent:${accent};">
        <div class="wiki-cat-icon">${cat.icon}</div>
        <div class="wiki-cat-name">${escapeHtml(name)}</div>
        <div class="wiki-cat-count">${escapeHtml(label)}</div>
      </button>
    `;
  }).join('');
  $body.innerHTML = `
    <div class="wiki-hub-intro">
      <span class="eyebrow">${escapeHtml(tOr('wiki.hub.eyebrow', 'Enciclopedia'))}</span>
      <span class="title">${escapeHtml(tOr('wiki.hub.title', 'Explora el mundo de los cócteles'))}</span>
      <div class="sub">${escapeHtml(tOr('wiki.hub.subtitle', 'Técnicas, destilados, historia, glosario y más. Busca o elige una categoría.'))}</div>
    </div>
    <div class="wiki-cat-grid">${categories}</div>
  `;
  $body.querySelectorAll('.wiki-cat-card').forEach(el => {
    el.addEventListener('click', () => openCategory(el.dataset.cat));
  });
}

// ─── Category ─────────────────────────────────────────────────────
function openCategory(catId, { push: shouldPush = true } = {}) {
  const cat = WIKI_CATEGORIES.find(c => c.id === catId);
  if (!cat) return renderHub();
  disposeScene();
  if (shouldPush) push({ view: state.view, catId: state.catId });
  setView('cat');
  state.catId = catId;
  state.artId = null;
  const name = tOr('wiki.cat.' + catId, catId);
  $title.textContent = name;
  const articles = cat.articles.map(art => {
    const label = tOr('wiki.art.' + catId + '.' + art.id, art.id);
    return `
      <button class="wiki-art-item" data-art="${art.id}">
        <span class="icon">${art.icon || '📄'}</span>
        <span class="name">${escapeHtml(label)}</span>
        ${art.has3d ? '<span class="tag-3d">3D</span>' : ''}
        <span class="arrow">→</span>
      </button>
    `;
  }).join('');
  const accent = extractAccent(cat.gradient);
  $body.innerHTML = `
    <div class="wiki-cat-header" style="--cat-accent:${accent};">
      <span class="eyebrow">${cat.icon} ${escapeHtml(tOr('wiki.category', 'Categoría'))}</span>
      <div class="name">${escapeHtml(name)}</div>
      <div class="desc">${escapeHtml(tOr('wiki.cat.' + catId + '.desc', ''))}</div>
    </div>
    <div class="wiki-art-list">${articles}</div>
  `;
  $body.querySelectorAll('.wiki-art-item').forEach(el => {
    el.addEventListener('click', () => openArticle(catId, el.dataset.art));
  });
}

// ─── Article ──────────────────────────────────────────────────────
function openArticle(catId, artId) {
  const cat = WIKI_CATEGORIES.find(c => c.id === catId);
  if (!cat) return renderHub();
  const art = cat.articles.find(a => a.id === artId);
  if (!art) return renderHub();
  disposeScene();
  push({ view: state.view, catId: state.catId, artId: state.artId });
  setView('art');
  state.catId = catId;
  state.artId = artId;
  const title = tOr('wiki.art.' + catId + '.' + artId, artId);
  $title.textContent = title;
  const wantsScene = art.has3d && art.scene && SCENE_BUILDERS[art.scene] && mountScene;

  $body.innerHTML = `
    <div class="wiki-article-hero">
      <div class="icon">${art.icon || '📄'}</div>
      <div class="category">${escapeHtml(tOr('wiki.cat.' + catId, catId))}</div>
      <div class="title">${escapeHtml(title)}</div>
    </div>
    ${wantsScene ? '<div class="wiki-article-3d" id="article-3d"></div>' : ''}
    <div class="wiki-article-content">
      ${renderArticleSections(catId, artId, art)}
    </div>
  `;

  if (wantsScene) {
    try {
      const host = document.getElementById('article-3d');
      mountScene(host, (scene, camera, ctx) => {
        SCENE_BUILDERS[art.scene](scene, camera, ctx, art.sceneParams);
      });
      attachHotspotPanel(host);
    } catch (e) {
      console.warn('[wiki] 3D scene failed:', e);
    }
  }
}

// Render a panel when any hotspot dot is clicked. Uses a single global
// listener (installed once) and appends the panel to the currently-active
// 3D container. Navigating between articles re-mounts the scene, which
// removes the old host DOM and any panel inside it.
let _wikiHotspotListenerInstalled = false;
function attachHotspotPanel(host) {
  if (_wikiHotspotListenerInstalled) return;
  _wikiHotspotListenerInstalled = true;
  window.addEventListener('wiki-hotspot-click', (ev) => {
    const d = ev.detail || {};
    const current = document.getElementById('article-3d');
    if (!current) return;
    const prev = current.querySelector('.hotspot-panel');
    if (prev) prev.remove();
    const panel = document.createElement('div');
    panel.className = 'hotspot-panel';
    panel.innerHTML = `
      <div class="hotspot-panel-head">
        <span class="hotspot-panel-title"></span>
        <button class="hotspot-panel-close" type="button" aria-label="Cerrar">×</button>
      </div>
      <div class="hotspot-panel-body"></div>
    `;
    panel.querySelector('.hotspot-panel-title').textContent = d.label || '';
    panel.querySelector('.hotspot-panel-body').textContent = d.detail || '';
    panel.querySelector('.hotspot-panel-close').addEventListener('click', () => panel.remove());
    current.appendChild(panel);
  });
}

function renderArticleSections(catId, artId, art) {
  const def = WIKI_ARTICLES[catId + '.' + artId];
  // No formal definition — render description if available, otherwise a stub.
  if (!def || !Array.isArray(def.sections)) {
    const desc = tOr('wiki.art.' + catId + '.' + artId + '.description', '');
    return desc
      ? `<div class="wiki-section"><p>${escapeHtml(desc)}</p></div>`
      : `<div class="wiki-empty">${escapeHtml(tOr('wiki.article.empty', 'Pronto añadiremos más contenido para este artículo.'))}</div>`;
  }

  let out = '';
  for (const section of def.sections) {
    switch (section.type) {
      case 'hero-3d':
        // already rendered above
        break;
      case 'text-block': {
        const label = tOr('wiki.label.' + section.key, humanize(section.key));
        const body  = tOr('wiki.art.' + catId + '.' + artId + '.' + section.key, '');
        if (!body) break;
        out += `<div class="wiki-section">
          <h3>${escapeHtml(label)}</h3>
          <p>${escapeHtml(body)}</p>
        </div>`;
        break;
      }
      case 'step-list': {
        const label = tOr('wiki.label.' + section.key, humanize(section.key));
        out += `<div class="wiki-section">
          <h3>${escapeHtml(label)}</h3>
          <div class="wiki-steps">${renderSteps(catId, artId, section.key)}</div>
        </div>`;
        break;
      }
      case 'tips': {
        const body = tOr('wiki.art.' + catId + '.' + artId + '.' + section.key, '');
        if (!body) break;
        out += `<div class="wiki-section tip">
          <h3>💡 ${escapeHtml(tOr('wiki.tips', 'Consejos'))}</h3>
          <p>${escapeHtml(body)}</p>
        </div>`;
        break;
      }
      case 'common-errors': {
        const body = tOr('wiki.art.' + catId + '.' + artId + '.' + section.key, '');
        if (!body) break;
        out += `<div class="wiki-section errors">
          <h3>⚠️ ${escapeHtml(tOr('wiki.common_errors', 'Errores comunes'))}</h3>
          <p>${escapeHtml(body)}</p>
        </div>`;
        break;
      }
      case 'history': {
        const body = tOr('wiki.art.' + catId + '.' + artId + '.history', '');
        if (!body) break;
        out += `<div class="wiki-section">
          <h3>${escapeHtml(tOr('wiki.history', 'Historia'))}</h3>
          <p>${escapeHtml(body)}</p>
        </div>`;
        break;
      }
      case 'timeline':
        out += renderTimeline();
        break;
      case 'glossary-list':
        out += renderGlossary(artId);
        break;
      default:
        // Fallback: try to render as text-block using section.key if available
        if (section.key) {
          const body = tOr('wiki.art.' + catId + '.' + artId + '.' + section.key, '');
          if (body) {
            out += `<div class="wiki-section"><p>${escapeHtml(body)}</p></div>`;
          }
        }
    }
  }
  if (!out) {
    const desc = tOr('wiki.art.' + catId + '.' + artId + '.description', '');
    out = desc
      ? `<div class="wiki-section"><p>${escapeHtml(desc)}</p></div>`
      : `<div class="wiki-empty">${escapeHtml(tOr('wiki.article.empty', 'Pronto añadiremos más contenido para este artículo.'))}</div>`;
  }
  return out;
}

function renderSteps(catId, artId, key = 'steps') {
  const raw = tOr('wiki.art.' + catId + '.' + artId + '.' + key, '');
  if (!raw) return '';
  // Split on |, •, or newlines — allows translators to use any of these.
  const parts = raw.split(/\s*(?:\||•|\n)\s*/).filter(Boolean);
  return parts.map((step, i) => `
    <div class="wiki-step">
      <div class="wiki-step-num">${i + 1}</div>
      <p>${escapeHtml(step)}</p>
    </div>
  `).join('');
}

function renderTimeline() {
  if (!TIMELINE_DATA || !TIMELINE_DATA.length) return '';
  const rows = TIMELINE_DATA.map(item => `
    <div class="wiki-step">
      <div class="wiki-step-num">${escapeHtml(String(item.year).slice(0, 4) || '·')}</div>
      <p>${escapeHtml(tOr('wiki.timeline.' + item.key, ''))}</p>
    </div>
  `).join('');
  return `<div class="wiki-section">
    <h3>${escapeHtml(tOr('wiki.history', 'Historia'))}</h3>
    <div class="wiki-steps">${rows}</div>
  </div>`;
}

function renderGlossary(artId) {
  const terms = (GLOSSARY_DATA && GLOSSARY_DATA[artId]) || [];
  if (!terms.length) return '';
  const rows = terms.map(term => `
    <div class="wiki-section">
      <h3>${escapeHtml(tOr('wiki.gloss.' + term, term))}</h3>
      <p>${escapeHtml(tOr('wiki.gloss.' + term + '.def', ''))}</p>
    </div>
  `).join('');
  return rows;
}

// ─── Search ───────────────────────────────────────────────────────
function onSearchInput() {
  const q = $search.value.trim().toLowerCase();
  if (!q) {
    // Empty → go back to whichever view we were on before searching
    if (state.view === 'search') renderHub();
    return;
  }
  disposeScene();
  setView('search');
  $title.textContent = tOr('wiki.search.title', 'Resultados de búsqueda');

  const hits = [];
  WIKI_CATEGORIES.forEach(cat => {
    cat.articles.forEach(art => {
      const name = tOr('wiki.art.' + cat.id + '.' + art.id, art.id);
      const catName = tOr('wiki.cat.' + cat.id, cat.id);
      if (name.toLowerCase().includes(q) || art.id.toLowerCase().includes(q) || catName.toLowerCase().includes(q)) {
        hits.push({ catId: cat.id, artId: art.id, art, catName, name });
      }
    });
  });

  if (!hits.length) {
    $body.innerHTML = `<div class="wiki-empty">${escapeHtml(tOr('wiki.search.empty', 'Sin resultados. Prueba otra búsqueda.'))}</div>`;
    return;
  }
  $body.innerHTML = `
    <div class="wiki-search-results">
      ${hits.map(h => `
        <button class="wiki-art-item" data-cat="${h.catId}" data-art="${h.artId}">
          <span class="icon">${h.art.icon || '📄'}</span>
          <span class="name">
            <div>${escapeHtml(h.name)}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">${escapeHtml(h.catName)}</div>
          </span>
          ${h.art.has3d ? '<span class="tag-3d">3D</span>' : ''}
          <span class="arrow">→</span>
        </button>
      `).join('')}
    </div>
  `;
  $body.querySelectorAll('.wiki-art-item').forEach(el => {
    el.addEventListener('click', () => openArticle(el.dataset.cat, el.dataset.art));
  });
}

function humanize(key) {
  return String(key || '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Boot — respect ?cat=<id> deep-link from the parent SPA (KnowledgeScreen)
{
  const params = new URLSearchParams(window.location.search);
  const initialCat = params.get('cat');
  if (initialCat && WIKI_CATEGORIES.some((c) => c.id === initialCat)) {
    openCategory(initialCat);
  } else {
    renderHub();
  }
}
</script>
