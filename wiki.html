<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stirio Wiki 3D</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    #wiki-root { height: 100vh; display: flex; flex-direction: column; }
    .wiki-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .wiki-back {
      background: none; border: none; color: var(--accent); font-size: 20px; cursor: pointer; padding: 4px;
      line-height: 1;
    }
    .wiki-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .wiki-search {
      flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px; color: var(--text); font-size: 0.875rem;
    }
    .wiki-search:focus { outline: none; border-color: var(--accent); }
    .wiki-layout { display: flex; flex: 1; overflow: hidden; }
    .wiki-sidebar {
      width: 280px; overflow-y: auto; border-right: 1px solid var(--border);
      padding: 8px 0; flex-shrink: 0;
    }
    @media (max-width: 600px) { .wiki-sidebar { display: none; } }
    .wiki-category { padding: 6px 16px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 8px; }
    .wiki-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; cursor: pointer; font-size: 0.875rem; color: var(--text-2);
      border-left: 2px solid transparent; transition: all 0.15s;
    }
    .wiki-item:hover { background: var(--surface-2); color: var(--text); }
    .wiki-item.active { border-left-color: var(--accent); color: var(--accent); background: color-mix(in oklch, var(--accent) 10%, transparent); }
    .wiki-item-icon { font-size: 1.1rem; flex-shrink: 0; }
    .wiki-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wiki-canvas-wrap { flex: 1; position: relative; }
    #r3f-canvas { width: 100%; height: 100%; display: block; }
    .wiki-fallback {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; text-align: center; padding: 24px;
    }
    .wiki-fallback-icon { font-size: 4rem; }
    .wiki-fallback-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .wiki-fallback-desc { color: var(--text-muted); font-size: 0.875rem; max-width: 300px; line-height: 1.5; }
    .wiki-info-panel {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 16px; max-height: 220px; overflow-y: auto; flex-shrink: 0;
    }
    .wiki-info-name { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .wiki-info-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .wiki-info-chip {
      background: color-mix(in oklch, var(--accent) 15%, var(--surface-2));
      color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem;
    }
    .wiki-info-desc { font-size: 0.875rem; color: var(--text-2); line-height: 1.6; }
    .wiki-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg); flex-direction: column; gap: 12px;
    }
    .wiki-spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="wiki-root">
  <div class="wiki-header">
    <button class="wiki-back" onclick="window.parent.postMessage({type:'wiki-close'},'*')" title="Volver">←</button>
    <span class="wiki-title">Encyclopedia 3D</span>
    <input class="wiki-search" type="search" placeholder="Buscar cóctel, ingrediente…" id="wiki-search-input">
  </div>
  <div class="wiki-layout">
    <nav class="wiki-sidebar" id="wiki-sidebar"></nav>
    <main class="wiki-main">
      <div class="wiki-canvas-wrap">
        <div class="wiki-loading" id="wiki-loading">
          <div class="wiki-spinner"></div>
          <span style="color:var(--text-muted);font-size:.875rem">Cargando Three.js…</span>
        </div>
        <canvas id="r3f-canvas"></canvas>
      </div>
      <div class="wiki-info-panel" id="wiki-info-panel" style="display:none"></div>
    </main>
  </div>
</div>

<!-- Three.js legacy (UMD) for compatibility without build step -->
<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// Sync theme from parent
(function() {
  const p = window.parent;
  if (p && p !== window) {
    try {
      const htmlEl = p.document.documentElement;
      ['theme','density','device','featured'].forEach(attr => {
        const v = htmlEl.getAttribute('data-' + attr);
        if (v) document.documentElement.setAttribute('data-' + attr, v);
      });
    } catch(e) {}
  }
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'wiki-theme') {
      Object.entries(e.data.attrs || {}).forEach(([k,v]) => document.documentElement.setAttribute(k, v));
    }
  });
})();

// Wiki data from existing wiki-data.js (loaded inline below or via fetch)
const WIKI_CATEGORIES = [
  { id: 'highball', label: 'Highball', icon: '🥃', items: ['Mojito', 'Gin & Tonic', 'Moscow Mule', 'Dark \'n\' Stormy'] },
  { id: 'sours', label: 'Sours', icon: '🍋', items: ['Whiskey Sour', 'Pisco Sour', 'Amaretto Sour', 'Daiquiri'] },
  { id: 'martini', label: 'Martini & Up', icon: '🍸', items: ['Dry Martini', 'Cosmopolitan', 'Manhattan', 'Negroni'] },
  { id: 'oldschool', label: 'Old-School', icon: '🥃', items: ['Old Fashioned', 'Sazerac', 'Vieux Carré', 'Toronto'] },
  { id: 'tiki', label: 'Tiki', icon: '🌺', items: ['Mai Tai', 'Zombie', 'Jungle Bird', 'Painkiller'] },
  { id: 'spirits', label: 'Espirituosos', icon: '🫙', items: ['Ron Zacapa 23', 'Mezcal Banhez', 'Vodka Grey Goose', 'Gin Hendrick\'s'] },
];

const COCKTAIL_INFO = {
  'Negroni': { chips: ['Clásico IBA', 'Stirred', 'Gin'], desc: 'El Negroni es un cóctel clásico italiano: partes iguales de ginebra, Campari y vermouth rosso. Inventado en Florencia c.1919.' },
  'Dry Martini': { chips: ['Clásico IBA', 'Stirred', 'Gin'], desc: 'El Dry Martini es la cumbre de la elegancia: ginebra y vermouth seco con aceituna o twist de limón.' },
  'Mojito': { chips: ['Contemporáneo IBA', 'Built', 'Ron'], desc: 'El Mojito es un highball cubano: ron, azúcar, lima, menta y soda.' },
  'Old Fashioned': { chips: ['Clásico', 'Stirred', 'Whiskey'], desc: 'El Old Fashioned es el primer cóctel documentado: whiskey, azúcar, bitters y un twist de cítrico.' },
  'Daiquiri': { chips: ['Clásico IBA', 'Shaken', 'Ron'], desc: 'El Daiquiri es pureza: ron blanco, lima y azúcar. Shakeado y servido en copa de cóctel.' },
};

let selectedItem = null;
let scene, camera, renderer, controls, model, animId;

function buildSidebar(filter) {
  const sidebar = document.getElementById('wiki-sidebar');
  sidebar.innerHTML = '';
  WIKI_CATEGORIES.forEach(cat => {
    const items = filter ? cat.items.filter(i => i.toLowerCase().includes(filter.toLowerCase())) : cat.items;
    if (!items.length) return;
    const catEl = document.createElement('div');
    catEl.className = 'wiki-category';
    catEl.textContent = cat.icon + '  ' + cat.label;
    sidebar.appendChild(catEl);
    items.forEach(name => {
      const el = document.createElement('div');
      el.className = 'wiki-item' + (selectedItem === name ? ' active' : '');
      el.innerHTML = `<span class="wiki-item-icon">${cat.icon}</span><span>${name}</span>`;
      el.onclick = () => selectItem(name);
      sidebar.appendChild(el);
    });
  });
}

function selectItem(name) {
  selectedItem = name;
  buildSidebar(document.getElementById('wiki-search-input').value);
  showInfo(name);
  loadModel(name);
}

function showInfo(name) {
  const panel = document.getElementById('wiki-info-panel');
  const info = COCKTAIL_INFO[name] || { chips: ['Cóctel'], desc: 'Explora este cóctel en 3D.' };
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="wiki-info-name">${name}</div>
    <div class="wiki-info-chips">${info.chips.map(c => `<span class="wiki-info-chip">${c}</span>`).join('')}</div>
    <div class="wiki-info-desc">${info.desc}</div>
  `;
}

function initThree() {
  const canvas = document.getElementById('r3f-canvas');
  const wrap = canvas.parentElement;

  scene = new THREE.Scene();
  scene.background = null; // transparent so CSS bg shows

  const bg = new THREE.Color();
  bg.set('#0d0508');
  scene.background = bg;

  camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.01, 100);
  camera.position.set(0, 0.3, 1.8);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.5;
  controls.maxDistance = 5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const key = new THREE.DirectionalLight(0xffa060, 1.4);
  key.position.set(2, 4, 3);
  key.castShadow = true;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x60a0ff, 0.5);
  fill.position.set(-3, 2, -2);
  scene.add(fill);

  // Floor (subtle)
  const floorGeo = new THREE.CircleGeometry(0.6, 64);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a0e12, roughness: 0.9, metalness: 0.1 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const resize = () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  };
  window.addEventListener('resize', resize);

  function animate() {
    animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  document.getElementById('wiki-loading').style.display = 'none';
  document.getElementById('r3f-canvas').style.display = 'block';
}

function loadModel(name) {
  // Remove existing model
  if (model) { scene.remove(model); model = null; }

  // Try loading the alambique.glb as a demo model for all items
  const loader = new THREE.GLTFLoader();
  const modelPath = 'models/alambique.glb';

  loader.load(
    modelPath,
    (gltf) => {
      model = gltf.scene;
      // Center and scale
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.0 / maxDim;
      model.scale.setScalar(scale);
      const center = box.getCenter(new THREE.Vector3());
      model.position.set(-center.x * scale, -center.y * scale + 0.05, -center.z * scale);
      model.castShadow = true;
      model.traverse(c => { if (c.isMesh) c.castShadow = true; });
      scene.add(model);
    },
    undefined,
    () => {
      // Fallback: show a placeholder glass shape
      showPlaceholderGlass();
    }
  );
}

function showPlaceholderGlass() {
  if (model) { scene.remove(model); model = null; }
  const group = new THREE.Group();
  // Stem
  const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 16);
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xaaddff, transparent: true, opacity: 0.35, roughness: 0, metalness: 0.1, transmission: 0.7 });
  group.add(new THREE.Mesh(stemGeo, glassMat));
  // Base
  const baseGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.02, 32);
  const base = new THREE.Mesh(baseGeo, glassMat);
  base.position.y = -0.21;
  group.add(base);
  // Bowl
  const bowlGeo = new THREE.CylinderGeometry(0.22, 0.04, 0.3, 32, 1, true);
  const bowl = new THREE.Mesh(bowlGeo, glassMat);
  bowl.position.y = 0.35;
  group.add(bowl);
  // Liquid
  const liquidGeo = new THREE.CylinderGeometry(0.19, 0.035, 0.22, 32);
  const liquidMat = new THREE.MeshPhysicalMaterial({ color: 0xff6030, transparent: true, opacity: 0.75, roughness: 0.05 });
  const liquid = new THREE.Mesh(liquidGeo, liquidMat);
  liquid.position.y = 0.31;
  group.add(liquid);
  group.position.y = 0.05;
  scene.add(group);
  model = group;
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar('');
  document.getElementById('wiki-search-input').addEventListener('input', e => buildSidebar(e.target.value));

  // Init Three.js
  if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined') {
    initThree();
    showPlaceholderGlass(); // show placeholder until user picks item
  } else {
    // Retry after a short delay (CDN might still be loading)
    setTimeout(() => {
      if (typeof THREE !== 'undefined') {
        initThree();
        showPlaceholderGlass();
      } else {
        document.getElementById('wiki-loading').innerHTML = `
          <div class="wiki-fallback">
            <div class="wiki-fallback-icon">🍸</div>
            <div class="wiki-fallback-title">Vista 3D no disponible</div>
            <div class="wiki-fallback-desc">No se pudo cargar Three.js. Comprueba tu conexión a internet.</div>
          </div>`;
      }
    }, 2000);
  }

  // Select first item
  selectItem('Negroni');
});
</script>
</body>
</html>
