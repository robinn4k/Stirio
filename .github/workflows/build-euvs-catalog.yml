name: Build EUVS catalog

# Manual trigger from the GitHub website (Actions tab → Build EUVS catalog →
# Run workflow). Runs the Python script that queries archive.org's EUVS
# Vintage Cocktail Books collection and rewrites data/euvs-catalog.json,
# then opens a pull request with the result. Designed for users who can't
# run Python locally (e.g., from an iPhone).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional cap on number of items (blank = full collection ~150)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/euvs-archive/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/euvs-archive/requirements.txt

      - name: Diagnostic — probe archive.org search API
        # Surfaces exactly what the search API returns for each query form
        # so we can see the failure mode in the Actions log when build_catalog
        # comes back empty. Doesn't fail the run — informational only.
        run: |
          set +e
          echo "## archive.org scrape API probes" >> "$GITHUB_STEP_SUMMARY"
          for Q in \
            'collection:"vintage-cocktail-books-euvs"' \
            'collection:(vintage-cocktail-books-euvs)' \
            'collection:vintage-cocktail-books-euvs' \
            'title:"The Savoy Cocktail Book"'; do
            CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -G "https://archive.org/services/search/v1/scrape" \
              --data-urlencode "q=$Q" \
              --data-urlencode "fields=identifier,collection" \
              --data-urlencode "count=3")
            TOTAL=$(jq -r '.total // "?"' /tmp/r.json 2>/dev/null || echo "parse-error")
            FIRST_ID=$(jq -r '.items[0].identifier // "—"' /tmp/r.json 2>/dev/null || echo "—")
            FIRST_COLL=$(jq -r '.items[0].collection // "—" | if type=="array" then join(",") else . end' /tmp/r.json 2>/dev/null || echo "—")
            echo "- \`$Q\` → HTTP $CODE, total=$TOTAL, first=$FIRST_ID (collection=$FIRST_COLL)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build catalog
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python tools/euvs-archive/build_catalog.py --limit "${{ inputs.limit }}"
          else
            python tools/euvs-archive/build_catalog.py
          fi

      - name: Sanity-check catalog
        run: |
          ENTRIES=$(jq 'length' data/euvs-catalog.json)
          echo "Generated $ENTRIES entries" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENTRIES" -lt 1 ]; then
            echo "::error::Catalog is empty — see the diagnostic step above for the response shape from each query form"
            exit 1
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/euvs-catalog-update
          delete-branch: true
          title: "chore(euvs-archive): regenerate catalog from Internet Archive"
          commit-message: |
            chore(euvs-archive): regenerate catalog from Internet Archive

            Generated by .github/workflows/build-euvs-catalog.yml on a runner
            with archive.org access. Replaces the hand-curated seed.
          body: |
            Automated regeneration of `data/euvs-catalog.json` via
            `tools/euvs-archive/build_catalog.py`, run from a GitHub Actions
            runner (which can reach archive.org — local sandboxes can't).

            **Replaces** the hand-curated 5-entry seed with the full mirror.
            Entry count in the workflow run's job summary above.

            ## Verify before merging

            - Open *Archivo EUVS* on a deploy preview (or local). Books load
              instantly from the new JSON.
            - Spot-check 3-4 book cards → each `archive.org/details/<id>` link
              resolves to a real page (no 404). This is the regression that
              caused PR #192 the first time around.
            - Optional: bump v11.30 → v11.31 in `sw.js`, `version.json`, and
              `index.html` if you want to force a SW reinstall. The catalog
              is fetched network-first, so existing clients will pick up
              the new file on next online visit even without bumping.
          labels: |
            automated
            data
          draft: true
