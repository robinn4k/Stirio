name: AI content (Groq)

# Manual trigger only. Set the GROQ_API_KEY repo secret first:
#   Settings → Secrets and variables → Actions → New repository secret.
# Get a key from https://console.groq.com/keys (free tier).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'translate'
        type: choice
        options:
          - translate
          - review
      scope:
        description: 'Key prefix (blank = all PARITY_EXCLUDE_PREFIXES)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Cap keys/articles (blank = no cap, useful for smoke tests)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: tools/ai-content
        run: pip install -r requirements.txt

      - name: Run AI content tool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(${{ github.event.inputs.mode }})
          SCOPE='${{ github.event.inputs.scope }}'
          LIMIT='${{ github.event.inputs.limit }}'
          if [ -n "$SCOPE" ]; then
            ARGS+=(--scope "$SCOPE")
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python tools/ai-content/cli.py "${ARGS[@]}"

      - name: Verify i18n parity (translate mode only)
        if: github.event.inputs.mode == 'translate'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test --silent

      - name: Open PR with the diff (translate mode only)
        if: github.event.inputs.mode == 'translate'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            AI content: ${{ github.event.inputs.mode }} ${{ github.event.inputs.scope }}
          branch: ai-content/${{ github.event.inputs.mode }}-${{ github.run_id }}
          title: 'AI content (${{ github.event.inputs.mode }}): ${{ github.event.inputs.scope }}'
          body: |
            Generated by `.github/workflows/ai-content.yml`.

            - Mode: `${{ github.event.inputs.mode }}`
            - Scope: `${{ github.event.inputs.scope || '(all PARITY_EXCLUDE_PREFIXES)' }}`
            - Limit: `${{ github.event.inputs.limit || '(none)' }}`

            Review the diff before merging. `npm test` already passed in the
            workflow, but check a sample translation for tone/accuracy.
          draft: true
          delete-branch: true

      - name: Upload review report (review mode only)
        if: github.event.inputs.mode == 'review'
        uses: actions/upload-artifact@v4
        with:
          name: review-report-${{ github.run_id }}
          path: tools/ai-content/reports/review-*.md
          if-no-files-found: error
          retention-days: 30
