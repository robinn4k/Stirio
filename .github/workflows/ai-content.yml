name: AI content (Groq)

# Manual trigger only. Set the GROQ_API_KEY repo secret first:
#   Settings → Secrets and variables → Actions → New repository secret.
# Get a key from https://console.groq.com/keys (free tier).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'translate'
        type: choice
        options:
          - translate
          - review
          - complete
      scope:
        description: 'Key prefix for translate/review (blank = all PARITY_EXCLUDE_PREFIXES)'
        required: false
        default: ''
        type: string
      category:
        description: 'Category for complete mode (blank = all wiki-data categories)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Cap keys/articles/stubs (blank = no cap, useful for smoke tests)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: tools/ai-content
        run: pip install -r requirements.txt

      - name: Run AI content tool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          SCOPE='${{ github.event.inputs.scope }}'
          CATEGORY='${{ github.event.inputs.category }}'
          LIMIT='${{ github.event.inputs.limit }}'
          ARGS=("$MODE")
          # translate / review accept --scope; complete accepts --category.
          if [ -n "$SCOPE" ] && [ "$MODE" != "complete" ]; then
            ARGS+=(--scope "$SCOPE")
          fi
          if [ -n "$CATEGORY" ] && [ "$MODE" = "complete" ]; then
            ARGS+=(--category "$CATEGORY")
          fi
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python tools/ai-content/cli.py "${ARGS[@]}"

      - name: Verify i18n parity (translate / complete modes)
        if: github.event.inputs.mode == 'translate' || github.event.inputs.mode == 'complete'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test --silent

      - name: Publish report (review / complete modes)
        if: github.event.inputs.mode == 'review' || github.event.inputs.mode == 'complete'
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          REPORT=$(ls -t tools/ai-content/reports/${MODE}-*.md 2>/dev/null | head -n 1 || true)
          if [ -z "$REPORT" ]; then
            echo '_(no report file produced)_' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 1. Inline summary on the run page (no auth needed if you can see the run).
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          # 2. Persisted copy at data/ai-reports/<mode>-latest.md so it's viewable
          #    on GitHub web (public repo, no auth) and fetchable by the admin
          #    console as static content. peter-evans/create-pull-request below
          #    will pick this file up in the diff.
          mkdir -p data/ai-reports
          cp "$REPORT" "data/ai-reports/${MODE}-latest.md"

      - name: Open PR with the diff (all modes)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            AI content: ${{ github.event.inputs.mode }} ${{ github.event.inputs.scope }}${{ github.event.inputs.category }}
          branch: ai-content/${{ github.event.inputs.mode }}-${{ github.run_id }}
          title: 'AI content (${{ github.event.inputs.mode }}): ${{ github.event.inputs.scope }}${{ github.event.inputs.category }}'
          body: |
            Generated by `.github/workflows/ai-content.yml`.

            - Mode: `${{ github.event.inputs.mode }}`
            - Scope: `${{ github.event.inputs.scope || '(all PARITY_EXCLUDE_PREFIXES)' }}`
            - Category: `${{ github.event.inputs.category || '(all)' }}`
            - Limit: `${{ github.event.inputs.limit || '(none)' }}`

            For `review` runs the only diff is `data/ai-reports/review-latest.md`
            (the markdown report). For `translate` / `complete` the diff also
            touches `i18n/*.json`. Sample a few entries before merging — the
            model can hallucinate dates and ABV.
          draft: true
          delete-branch: true

      - name: Upload review report (review mode only)
        if: github.event.inputs.mode == 'review'
        uses: actions/upload-artifact@v4
        with:
          name: review-report-${{ github.run_id }}
          path: tools/ai-content/reports/review-*.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete report (complete mode only)
        if: github.event.inputs.mode == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: complete-report-${{ github.run_id }}
          path: tools/ai-content/reports/complete-*.md
          if-no-files-found: warn
          retention-days: 30
