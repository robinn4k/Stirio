<!DOCTYPE html>
<html lang="es" data-theme="lounge" data-density="comfortable" data-featured="stacked" data-device="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0508">
  <meta name="description" content="Stirio – Aprende coctelería, pon a prueba tus conocimientos y escala el ranking global">

  <!-- Content-Security-Policy: 'unsafe-eval' y 'unsafe-inline' son necesarios
       mientras Babel Standalone transpile JSX en el navegador. Restringen los
       destinos permitidos a las CDNs y endpoints de Firebase que la app usa
       realmente, limitando el blast-radius ante un XSS en datos de usuario. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://*.googleusercontent.com https://www.gstatic.com; font-src 'self' data:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app https://firestore.googleapis.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://*.firebasestorage.app https://firebaseapp.com https://*.firebaseapp.com; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Stirio 🍸</title>
  <link rel="icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="icon_ios.png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Twitter share card (static — scrapers don't execute JS) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stirio">
  <meta property="og:title" content="Stirio — Aprende coctelería">
  <meta property="og:description" content="Quizzes, duelos, flashcards y una enciclopedia 3D de cócteles. Aprende en 60 segundos.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Stirio — Aprende coctelería">
  <meta property="og:url" content="https://robinn4k.github.io/Stirio/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Stirio — Aprende coctelería">
  <meta name="twitter:description" content="Quizzes, duelos, flashcards y una enciclopedia 3D de cócteles. Aprende en 60 segundos.">
  <meta name="twitter:image" content="og-image.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root"></div>

  <!-- Importmap for three.js — required by js/wiki-3d.js (lazy-loaded by
       js/three-scene.jsx when an article has a 3D scene). Mirrors wiki.html
       so both entry points share one CDN bundle. MUST come before any
       <script type="module"> that uses these specifiers. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <!-- React 18 + Babel Standalone (CDN, no build step).
       SRI integrity hashes atados a las versiones exactas: si alguna CDN
       sirviera un bundle modificado, el navegador lo rechaza. Al subir de
       versión, recalcular con `curl -sSL <url> | openssl dgst -sha384 -binary | openssl base64 -A`. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"
          integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"
          crossorigin="anonymous"></script>

  <!-- App version — kept in sync with STATIC_CACHE_VERSION in sw.js -->
  <script>window.STIRIO_VERSION = '10.71';</script>

  <!-- Data layer (plain scripts — sets window.StirioRepo and game globals) -->
  <script src="js/repo-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ficha-images.js"></script>
  <script src="js/articles.js"></script>

  <!-- Legacy ES modules (loaded asynchronously, exposed on window.st*) -->
  <script type="module">
    import('./js/auth.js').then(m => { window.stAuth = m; }).catch(()=>{});
    import('./js/leaderboard.js').then(m => { window.stLeaderboard = m; }).catch(()=>{});
    import('./js/lang.js').then(m => { window.stLang = m; }).catch(()=>{});
    import('./js/blind.js').then(m => { window.stBlind = m; }).catch(()=>{});
    import('./js/constructor.js').then(m => { window.stConstructor = m; }).catch(()=>{});
    import('./js/bot.js').then(m => { window.stBot = m; }).catch(()=>{});
    import('./js/rivals.js').then(m => { window.stRivals = m; }).catch(()=>{});
    import('./js/achievements.js').then(m => { window.stAchievements = m; }).catch(()=>{});
    import('./js/questions.js').then(m => { window.stQuestions = m; }).catch(()=>{});
    import('./js/daily.js').then(m => { window.stDaily = m; }).catch(()=>{});
    import('./js/learn.js').then(m => { window.stLearn = m; }).catch(()=>{});
    import('./js/academy_data.js').then(m => { window.stAcademyData = m; }).catch(()=>{});
    import('./js/academy.js').then(m => { window.stAcademy = m; }).catch(()=>{});
    // Seed window.MAP_REGIONS so Home → Referencia rápida can show the real
    // count + preview. wiki-map.js is otherwise only loaded inside map.html.
    import('./js/wiki-map.js').then(m => {
      if (m.SPIRIT_REGIONS) {
        window.MAP_REGIONS = m.SPIRIT_REGIONS;
        window.dispatchEvent(new CustomEvent('stirio:mapregionsready'));
      }
    }).catch(err => console.warn('wiki-map seed failed:', err));
  </script>

  <!-- React UI components (Babel transpiles JSX in-browser as classic scripts — shared top-level scope) -->
  <script type="text/babel" data-presets="react" src="js/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/lesson.jsx"></script>
  <!-- screens/ — the former monolithic js/screens.jsx, split per-screen.
       shared.jsx MUST load first: it provides SectionHeader used by Home
       and Profile. The per-screen files are independent of each other. -->
  <script type="text/babel" data-presets="react" src="js/screens/shared.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/Onboarding.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/Home.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/Profile.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/screens/ModeSheet.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/reference.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/legacy-modes.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/duel.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/glossary.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/map.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/library.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/arcade.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/memory.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/rhythm.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/comanda.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/article.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/three-scene.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/knowledge.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/app.jsx"></script>

  <!-- Service worker registration + auto-reload on new version -->
  <script>
    if ('serviceWorker' in navigator) {
      // When the active SW changes (new version claimed the page), reload
      // once so the page uses the new assets instead of a mix of old/new.
      // Guarded to avoid infinite reload loops.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        // Only reload if there was already a controller — skips the very
        // first SW install on a fresh visit.
        reloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
